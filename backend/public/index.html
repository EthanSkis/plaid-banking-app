<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12110f">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0908;
    --bg-2: #12100d;
    --card: rgba(24, 22, 19, .86);
    --card-solid: #171512;
    --line: rgba(232, 214, 176, .09);
    --line-2: rgba(232, 214, 176, .16);
    --text: #ece8e1;
    --muted: #8f897f;
    --dim: #5d584f;
    --gold: #c9aa6c;
    --gold-hi: #f1dfb3;
    --gold-lo: #6e5a35;
    --pos: #c9aa6c;
    --neg: #d98b78;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; color: var(--text);
    font: 15px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-feature-settings: "tnum" 1, "cv11" 1;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(120% 70% at 50% 115%, rgba(150, 104, 40, .38), transparent 60%),
      radial-gradient(60% 40% at 50% 0%, rgba(201, 170, 108, .05), transparent 70%),
      var(--bg);
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---------- App shell ---------- */
  .shell {
    position: relative; height: 100dvh; max-width: 440px; margin: 0 auto; overflow: hidden;
    background: linear-gradient(180deg, #0f0e0c 0%, #0b0a09 55%, #0b0a09 100%);
    box-shadow: 0 0 0 1px rgba(232, 214, 176, .06), 0 40px 120px rgba(0, 0, 0, .6);
  }
  @media (min-width: 520px) {
    .shell { height: calc(100dvh - 48px); margin-top: 24px; border-radius: 44px;
             box-shadow: 0 0 0 1px rgba(232, 214, 176, .14), 0 0 0 7px #0d0c0a, 0 0 0 8px rgba(232, 214, 176, .22), 0 50px 140px rgba(0,0,0,.7); }
  }
  /* Pinstripe texture, fading out toward the bottom */
  .shell::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(90deg, rgba(232, 214, 176, .035) 0 1px, transparent 1px 23px);
    -webkit-mask: radial-gradient(130% 55% at 50% 0%, #000 30%, transparent 75%);
            mask: radial-gradient(130% 55% at 50% 0%, #000 30%, transparent 75%);
  }

  .topbar {
    position: absolute; z-index: 5; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: max(18px, env(safe-area-inset-top)) 18px 10px;
    background: linear-gradient(180deg, #0e0d0b 0 55%, rgba(14,13,11,0));
  }
  .round {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 30%, #1d1b18, #121110);
    box-shadow: inset 0 0 0 1px var(--line-2), 0 6px 18px rgba(0,0,0,.4);
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .round:hover { box-shadow: inset 0 0 0 1px rgba(232,214,176,.3), 0 6px 18px rgba(0,0,0,.4); }
  .round:active { transform: scale(.94); }
  .round svg { width: 20px; height: 20px; stroke: var(--text); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .round.spinning svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dots { display: flex; gap: 7px; padding: 8px 11px; border-radius: 999px;
          background: #151311; box-shadow: inset 0 0 0 1px var(--line-2); }
  .dots button { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); transition: background .25s, transform .25s; }
  .dots button.on { background: var(--text); transform: scale(1.1); }

  /* ---------- Pager ---------- */
  .pager { position: relative; z-index: 1; height: 100%; display: flex; overflow-x: auto; overflow-y: hidden;
           scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .pager::-webkit-scrollbar { display: none; }
  .page { flex: 0 0 100%; height: 100%; overflow-y: auto; scroll-snap-align: start; scrollbar-width: none;
          padding: 96px 18px 48px; transition: opacity .35s ease, filter .35s ease; }
  .page::-webkit-scrollbar { display: none; }
  .page.away { opacity: .25; filter: blur(3px); }

  .hero { text-align: center; padding: 22px 0 6px; }
  .eyebrow { color: var(--gold); font-size: 17px; font-weight: 400; letter-spacing: .01em; }
  .amount { font-size: 40px; font-weight: 400; letter-spacing: -.025em; margin: 6px 0 8px; line-height: 1.1; }
  .amount .cents { color: var(--text); }
  .subline { color: #b9b3a8; font-size: 14.5px; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 20px; }
  .tri { width: 0; height: 0; border-left: 5.5px solid transparent; border-right: 5.5px solid transparent; }
  .tri.up { border-bottom: 9px solid #b9b3a8; }
  .tri.down { border-top: 9px solid var(--neg); }

  .section-head { display: flex; justify-content: space-between; align-items: center; margin: 30px 8px 12px; }
  .section-head h2 { margin: 0; font-size: 15.5px; font-weight: 400; color: #cfc9be; }
  .link { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--text); }
  .link svg { width: 15px; height: 15px; }

  /* ---------- Account cards ---------- */
  .acct {
    position: relative; display: flex; align-items: center; gap: 18px; min-height: 112px; margin-bottom: 10px;
    border-radius: var(--radius); overflow: hidden; background: var(--card);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .acct::after { /* fine diagonal sheen like brushed metal */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(115deg, rgba(232,214,176,.025) 0 1px, transparent 1px 7px);
    -webkit-mask: linear-gradient(90deg, transparent 30%, #000);
            mask: linear-gradient(90deg, transparent 30%, #000);
  }
  .acct .info { position: relative; z-index: 1; min-width: 0; padding: 14px 16px 14px 0; }
  .acct .label { color: var(--gold); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acct .bal { font-size: 22px; letter-spacing: -.01em; margin: 2px 0 3px; }
  .acct .meta { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { position: absolute; z-index: 2; top: 0; right: 0; padding: 8px 14px; font-size: 13px; color: #cfc9be;
           background: #1f1d19; border-bottom-left-radius: 14px; box-shadow: inset 1px -1px 0 var(--line); }
  .acct.warn { box-shadow: inset 0 0 0 1px rgba(217, 139, 120, .35); }

  /* Thumbnails: pure CSS metal objects */
  .thumb { position: relative; flex: 0 0 96px; align-self: stretch; overflow: hidden; }
  .thumb.card::before { /* card standing on its edge */
    content: ""; position: absolute; left: 0; top: 18px; bottom: -6px; width: 80px; border-radius: 0 10px 0 0;
    background: linear-gradient(160deg, #24211c 0%, #121110 55%, #0d0c0b 100%);
    box-shadow: inset -1px 1px 0 rgba(241,223,179,.35), inset 0 -16px 22px -10px rgba(201,170,108,.55);
  }
  .thumb.card::after { /* glow along the bottom edge */
    content: ""; position: absolute; left: 6px; right: 6px; bottom: -4px; height: 22px;
    background: radial-gradient(60% 100% at 50% 100%, rgba(241,223,179,.55), transparent 70%);
  }
  .thumb.gold::before {
    background: linear-gradient(150deg, #e6cf98 0%, #a8874c 35%, #5e4b2a 70%, #2a2216 100%);
    box-shadow: inset -1px 1px 0 rgba(255,244,214,.7), inset 0 -10px 20px -6px rgba(255,236,190,.5);
  }
  .thumb .emblem { position: absolute; z-index: 2; top: 30px; left: 54px; width: 16px; height: 16px; transform: rotate(45deg);
                   border: 1.5px solid var(--gold-hi); border-radius: 3px; box-shadow: 0 0 10px rgba(241,223,179,.5); }
  .thumb.gold .emblem { border-color: #3b2f1b; box-shadow: none; opacity: .55; }
  .coins { position: absolute; inset: 0; }
  .coins i { position: absolute; bottom: -4px; width: 46px; border-radius: 4px;
             background: repeating-linear-gradient(0deg, #8c7244 0 2px, #3a2f1e 2px 4px);
             box-shadow: inset 0 0 0 1px rgba(241,223,179,.25), 0 -2px 10px rgba(201,170,108,.25); }
  .coins i:nth-child(1) { left: 0; height: 30px; opacity: .55; }
  .coins i:nth-child(2) { left: 36px; height: 52px; }
  .coins b { position: absolute; left: 38px; bottom: 52px; width: 42px; height: 42px; border-radius: 50%;
             background: radial-gradient(circle at 35% 30%, #3b3326, #15130f 70%);
             box-shadow: inset 0 0 0 1.5px #b8975a, inset 0 0 0 4px #15130f, inset 0 0 0 5px rgba(201,170,108,.45), 0 0 18px rgba(201,170,108,.35); }
  .coins b::after { content: ""; position: absolute; inset: 13px; transform: rotate(45deg); border: 1.5px solid var(--gold-hi); border-radius: 2px; }
  .thumb.bars::before { content: ""; position: absolute; left: 18px; right: 14px; bottom: 0; top: 26px;
    background: linear-gradient(0deg, #6e5a35, #e6cf98);
    clip-path: polygon(0 70%, 20% 70%, 20% 100%, 30% 100%, 30% 42%, 50% 42%, 50% 100%, 60% 100%, 60% 8%, 80% 8%, 80% 100%, 0 100%); }

  /* ---------- Net worth chart ---------- */
  .chart { position: relative; height: 210px; margin: 18px -18px 6px; touch-action: pan-y; }
  .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .chart .empty-chart { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13.5px; text-align: center; padding: 0 40px; }
  .ranges { display: flex; justify-content: space-between; padding: 6px 0 0; }
  .ranges button { padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--muted); transition: background .2s, color .2s; }
  .ranges button.on { background: #2a251c; color: var(--gold); }

  .panel { border-radius: var(--radius); background: var(--card); box-shadow: inset 0 0 0 1px var(--line); padding: 18px 22px 20px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .split .k { color: var(--gold); font-size: 13.5px; }
  .split .v { font-size: 20px; margin-top: 2px; }
  .ratio { display: flex; gap: 5px; margin-top: 18px; height: 2px; }
  .ratio span { border-radius: 2px; transition: flex-grow .6s cubic-bezier(.2,.8,.2,1); }
  .ratio .a { background: var(--gold); } .ratio .l { background: #6f6a62; }

  .action { display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 10px; padding: 18px 22px; border-radius: var(--radius);
            background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--gold); font-weight: 500; text-align: left; }
  .action svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
  .action .chev { margin-left: auto; color: var(--muted); }

  /* ---------- Lists ---------- */
  .list { border-radius: var(--radius); background: var(--card); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .l { min-width: 0; flex: 1; }
  .row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { color: var(--muted); font-size: 12.5px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .r { text-align: right; white-space: nowrap; }
  .row .r.in { color: var(--gold); }
  .row.faded { opacity: .5; }
  .logo { flex: 0 0 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; overflow: hidden;
          background: #1f1c18; box-shadow: inset 0 0 0 1px var(--line); color: var(--gold); font-size: 13px; font-weight: 600; }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .empty { padding: 20px 18px; color: var(--muted); font-size: 14px; }
  .search { width: 100%; margin-bottom: 10px; padding: 12px 16px; border: 0; border-radius: 14px; font: inherit; color: var(--text);
            background: var(--card); box-shadow: inset 0 0 0 1px var(--line); outline: none; }
  .search:focus { box-shadow: inset 0 0 0 1px var(--gold-lo); }
  .search::placeholder { color: var(--dim); }
  .more { display: block; margin: 12px auto 0; padding: 8px 16px; border-radius: 999px; color: var(--gold); font-size: 14px; box-shadow: inset 0 0 0 1px var(--line-2); }

  .bars-chart { display: grid; gap: 14px; padding: 18px; }
  .bm { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; font-size: 13px; }
  .bm .m { color: var(--muted); }
  .bm .track { display: grid; gap: 3px; }
  .bm .track i { display: block; height: 4px; border-radius: 2px; }
  .bm .track i.inc { background: var(--gold); } .bm .track i.out { background: #5a554d; }
  .bm .n.neg { color: var(--neg); }

  /* ---------- Sheet (menu) ---------- */
  .scrim { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sheet { position: absolute; z-index: 21; left: 0; right: 0; bottom: 0; padding: 10px 18px max(24px, env(safe-area-inset-bottom));
           background: #141210; border-radius: 26px 26px 0 0; box-shadow: inset 0 1px 0 var(--line-2);
           transform: translateY(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); max-height: 80%; overflow-y: auto; }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .grabber { width: 40px; height: 4px; border-radius: 2px; background: #3a362f; margin: 0 auto 16px; }
  .sheet h3 { margin: 18px 6px 10px; font-size: 13px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .sheet .row button { color: var(--gold); font-size: 14px; }
  .sheet .row button.danger { color: var(--neg); }
  .btn { width: 100%; padding: 15px; border-radius: 14px; font-weight: 500; color: #1a140a;
         background: linear-gradient(180deg, #ecd7a4, #b8975a); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 8px 24px rgba(201,170,108,.18); }
  .btn.ghost { background: #1d1b18; color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); margin-top: 10px; }
  .btn:disabled { opacity: .6; }

  /* ---------- Login ---------- */
  .login { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 28px; }
  .login .mark { width: 54px; height: 54px; margin: 0 auto 8px; border-radius: 16px; display: grid; place-items: center;
                 background: radial-gradient(circle at 50% 30%, #241f17, #121110); box-shadow: inset 0 0 0 1px rgba(201,170,108,.4), 0 0 40px rgba(201,170,108,.15); }
  .login .mark i { width: 18px; height: 18px; transform: rotate(45deg); border: 2px solid var(--gold-hi); border-radius: 4px; }
  .login h1 { margin: 0; text-align: center; font-weight: 400; font-size: 30px; letter-spacing: -.02em; }
  .login p { margin: 0 0 18px; text-align: center; color: var(--muted); }
  .login input { padding: 15px 16px; border: 0; border-radius: 14px; font: inherit; color: var(--text); outline: none;
                 background: #161411; box-shadow: inset 0 0 0 1px var(--line-2); }
  .login input:focus { box-shadow: inset 0 0 0 1px var(--gold); }
  .err { min-height: 20px; color: var(--neg); font-size: 14px; text-align: center; }

  .toast { position: fixed; z-index: 50; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0;
           padding: 11px 18px; border-radius: 999px; background: #1f1c18; box-shadow: inset 0 0 0 1px var(--line-2), 0 10px 30px rgba(0,0,0,.5);
           font-size: 14px; max-width: calc(100% - 32px); transition: opacity .25s, transform .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* New bits shared by both layouts */
  .brand, .btn-sm { display: none; }
  .nw-foot .panel { margin-top: 22px; }
  .note { margin-top: 12px; text-align: center; color: var(--dim); font-size: 12.5px; }

  /* ---------- Desktop dashboard ---------- */
  @media (min-width: 960px) {
    body { overflow: auto; background-attachment: fixed; }
    .shell { max-width: 1320px; height: auto; min-height: 100vh; margin: 0 auto; padding: 0 36px 64px;
             border-radius: 0; background: transparent; box-shadow: none; overflow: visible; }
    .shell::before { position: fixed; }
    #app { height: auto !important; }
    .topbar { position: sticky; padding: 20px 0 18px; gap: 12px;
              background: linear-gradient(180deg, #0b0a09 0 70%, rgba(11,10,9,0)); }
    .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; font-size: 20px; letter-spacing: -.01em; }
    .brand .mk { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
                 background: radial-gradient(circle at 50% 30%, #241f17, #121110); box-shadow: inset 0 0 0 1px rgba(201,170,108,.4); }
    .brand .mk i { width: 13px; height: 13px; transform: rotate(45deg); border: 1.6px solid var(--gold-hi); border-radius: 3px; }
    .dots { display: none; }
    #menuBtn { order: 3; }
    .round { width: 42px; height: 42px; }
    .btn-sm { display: inline-flex; align-items: center; padding: 11px 18px; border-radius: 999px; font-weight: 500; font-size: 14px;
              color: #1a140a; background: linear-gradient(180deg, #ecd7a4, #b8975a); box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }

    .pager { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; height: auto; overflow: visible; align-items: start; }
    .page, .page.away { height: auto; overflow: visible; padding: 0; opacity: 1; filter: none; }
    #pNet { order: 1; } #pBanking { order: 2; }

    .nw-card { position: relative; overflow: hidden; border-radius: 26px; padding: 30px 34px 24px; background: var(--card);
               box-shadow: inset 0 0 0 1px var(--line); }
    .nw-card::before { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(90deg, rgba(232,214,176,.03) 0 1px, transparent 1px 28px);
      -webkit-mask: linear-gradient(180deg, #000, transparent 85%); mask: linear-gradient(180deg, #000, transparent 85%); }
    #pNet .hero { text-align: left; padding: 0; }
    #pNet .amount { font-size: 56px; }
    #pNet .subline { justify-content: flex-start; }
    .chart { height: 330px; margin: 22px -34px 10px; }
    .ranges { justify-content: flex-start; gap: 6px; }
    .note { text-align: left; }

    .nw-foot { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-top: 16px; }
    .nw-foot .panel { margin-top: 0; }
    .nw-foot .action { margin-top: 0; height: 100%; }
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }

    .bank-hero { text-align: left; padding: 24px 26px; border-radius: 22px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
    .bank-hero .amount { font-size: 34px; }
    .bank-hero .subline { justify-content: flex-start; }
    #pBanking .section-head:first-of-type { margin-top: 24px; }

    .scrim { position: fixed; }
    .sheet { position: fixed; top: 0; bottom: 0; left: auto; width: 400px; max-height: none; border-radius: 0;
             padding: 28px 22px; transform: translateX(105%); box-shadow: inset 1px 0 0 var(--line-2), -30px 0 80px rgba(0,0,0,.5); }
    .sheet .grabber { display: none; }
    .open .sheet { transform: none; }
    .toast { bottom: 36px; }
  }

  .fade-in { animation: fadeIn .6s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ===================== unslop pass (polish mode) =====================
     Rules: unslop by Damir Sokolovsky (@heydamir), CC BY 4.0 */
  :root {
    /* Color: one warm neutral ramp, three text roles, one accent */
    --bg: #12110f; --page: #161513; --card: #1c1a18; --raised: #262421;
    --line: rgba(239, 233, 222, .08); --line-2: rgba(239, 233, 222, .12);
    --text: #efe9de; --text-2: #aaa398; --muted: #8a847a; --dim: #8a847a;
    --radius: 16px; --ease: cubic-bezier(.22, 1, .36, 1);
  }
  /* Kept by choice: the warm page glow and the pinstripe / brushed-metal textures */
  .shell { background: var(--bg); }
  @media (min-width: 520px) { .shell { background: transparent; } }
  .thumb.card::after { display: none; }   /* colored halo under the card object */
  .topbar { padding: max(16px, env(safe-area-inset-top)) 16px 8px; background: linear-gradient(180deg, var(--bg) 0 55%, rgba(18,17,15,0)); }

  /* Layout: tablets get the full width, not a framed phone column */

  .round { background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2);
           transition: background-color 150ms var(--ease), transform 150ms var(--ease); }
  .round:hover { background: var(--raised); box-shadow: inset 0 0 0 1px var(--line-2); }
  .round:active { transform: scale(.97); }
  .round svg, .action svg, .link svg { width: 18px; height: 18px; stroke-width: 1.5; fill: none; stroke: currentColor; stroke-linecap: round; }
  .round svg { stroke: var(--text); }
  .dots { gap: 8px; padding: 8px 12px; background: var(--card); }
  .dots button { width: 8px; height: 8px; background: var(--raised); transition: background-color 150ms var(--ease); }
  .dots button.on { transform: none; background: var(--text); }

  /* Spacing on the 4px grid */
  .page { padding: 96px 16px 48px; transition: opacity 300ms var(--ease); }
  .page.away { filter: none; }
  .hero { padding: 24px 0 8px; }
  .amount { margin: 8px 0; letter-spacing: -.02em; }
  .section-head { margin: 32px 4px 12px; }
  .acct { gap: 16px; margin-bottom: 8px; }
  .acct .info { padding: 16px 16px 16px 0; }
  .acct .bal { font-size: 24px; letter-spacing: 0; margin: 4px 0; }
  .badge { padding: 8px 12px; border-bottom-left-radius: 12px; background: var(--raised); color: var(--text-2); font-size: 12px; }
  .chart { margin: 16px -16px 8px; }
  .ranges { padding: 8px 0 0; }
  .ranges button { padding: 4px 12px; font-size: 13px; transition: background-color 150ms var(--ease), color 150ms var(--ease); }
  .ranges button:hover { color: var(--text); }
  .ranges button.on { background: var(--raised); }
  .panel { padding: 20px 24px; }
  .nw-foot .panel { margin-top: 24px; }
  .ratio { gap: 4px; margin-top: 16px; }
  .ratio span { transition: none; }
  .action { gap: 12px; margin-top: 8px; padding: 20px 24px; }
  .row { padding: 12px 16px; }
  .empty { padding: 20px 16px; }
  .search { margin-bottom: 8px; border-radius: 10px; }
  .more { padding: 8px 16px; border-radius: 10px; }
  .bars-chart { gap: 12px; padding: 16px 20px; }
  .bm .track { gap: 4px; }
  .sheet { padding: 12px 16px max(24px, env(safe-area-inset-bottom)); border-radius: 20px 20px 0 0; background: var(--bg);
           transition: transform 400ms var(--ease); }
  .scrim { transition: opacity 200ms var(--ease); }
  .login { gap: 12px; padding: 0 32px; }
  .login p { margin: 0 0 16px; }
  .toast { padding: 12px 16px; bottom: 32px; border-radius: 10px; background: var(--raised);
           transform: translate(-50%, 8px); transition: opacity 200ms var(--ease), transform 200ms var(--ease); }

  /* Color: accent only on the chart, the selection, the primary action and Add */
  .eyebrow { color: var(--text-2); font-size: 16px; letter-spacing: 0; }
  .subline { color: var(--text-2); font-size: 14px; }
  .tri.up { border-bottom-color: var(--text-2); }
  .section-head h2 { color: var(--text); font-size: 15px; }
  .link { color: var(--gold); }
  .acct .label { color: var(--text-2); }
  .acct .meta { color: var(--muted); font-size: 13px; }
  .split .k { color: var(--text-2); font-size: 13px; }
  .ratio .l { background: var(--muted); }
  .action { color: var(--text); }
  .action svg, .action .chev { color: var(--muted); }
  .row .s { font-size: 12px; }
  .row .r.in { color: var(--text); }
  .logo { background: var(--raised); color: var(--muted); border-radius: 8px; font-weight: 500; }
  .search, .login input { background: var(--card); }
  .search:focus, .login input:focus { box-shadow: inset 0 0 0 1px var(--gold); }
  .search::placeholder, .login input::placeholder { color: var(--muted); }
  .more { color: var(--text-2); }
  .bm .track i.out { background: var(--raised); }
  .note { color: var(--muted); font-size: 12px; }
  .empty-chart { font-size: 13px; }

  /* Buttons: solid accent, no gradient, no colored shadow, control radius */
  .btn { height: 48px; padding: 0 16px; border-radius: 10px; background: var(--gold);
         box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25); }
  .btn.ghost { background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); margin-top: 8px; }
  .link { gap: 8px; }
  .ranges { gap: 8px; }
  .login input { height: 48px; padding: 0 16px; border-radius: 10px; }

  /* Type: sentence case, sizes from one scale, no negative tracking under 40px */
  .sheet h3 { text-transform: none; letter-spacing: 0; margin: 20px 4px 8px; font-size: 13px; }
  .login h1 { font-size: 32px; letter-spacing: 0; }

  /* Visuals: the metal objects stay, their colored halos go */
  .thumb .emblem { box-shadow: none; }
  .coins i { box-shadow: inset 0 0 0 1px rgba(241, 223, 179, .25); }
  .coins b { box-shadow: inset 0 0 0 1.5px #b8975a, inset 0 0 0 4px #15130f, inset 0 0 0 5px rgba(201, 170, 108, .45); }
  .login .mark { width: 56px; height: 56px; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2); }
  .login .mark i { border-color: var(--gold); }

  /* Details: a visible focus ring for keyboard users */
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* Motion: one entrance for the content, not one per card */
  .acct.fade-in { animation: none; }
  #app:not(.hidden) .pager { animation: fadeIn 400ms var(--ease) both; }

  /* Layout: tablets get the full width, not a framed phone column (content capped for line length) */
  @media (min-width: 520px) and (max-width: 959px) {
    .shell { height: 100dvh; margin-top: 0; border-radius: 0; box-shadow: none; max-width: none; }
    .page { padding-left: max(16px, calc((100% - 560px) / 2)); padding-right: max(16px, calc((100% - 560px) / 2)); }
    .chart { margin-left: 0; margin-right: 0; }
  }
  input:focus-visible { outline: none; }   /* inputs already show a gold hairline on focus */
  .login p { text-wrap: balance; }

  @media (min-width: 960px) {
    .shell { max-width: 1440px; padding: 0 32px 64px; }
    .page, .page.away { padding: 0; }
    .topbar { padding: 12px 0; min-height: 64px; }
    .pager { gap: 24px; grid-template-columns: minmax(0, 1fr) clamp(320px, 30vw, 400px); }
    .round { width: 40px; height: 40px; }
    .brand { gap: 12px; font-size: 18px; font-weight: 500; letter-spacing: 0; }
    .brand .mk { width: 32px; height: 32px; border-radius: 8px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2); }
    .brand .mk i { border-color: var(--gold); }
    .btn-sm { height: 40px; padding: 0 16px; border-radius: 10px; background: var(--gold); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25); }
    .nw-card { padding: 32px 32px 24px; border-radius: 20px; }
    #pNet .amount { letter-spacing: -.03em; }
    .chart { margin: 24px -32px 8px; }
    .nw-foot .panel { margin-top: 0; }
    .bank-hero { padding: 24px; border-radius: 20px; }
    .bank-hero .amount { font-size: 32px; letter-spacing: 0; }
    .sheet { padding: 24px; border-radius: 0; }
  }
</style>
</head>
<body>
<div class="shell" id="shell">

  <!-- Login -->
  <form id="login" class="login hidden">
    <div class="mark"><i></i></div>
    <h1>Ledger</h1>
    <p>Balances, spending and net worth from your banks</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign in</button>
    <div id="loginErr" class="err"></div>
  </form>

  <!-- App -->
  <div id="app" class="hidden" style="height:100%">
    <div class="topbar">
      <button class="round" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
      </button>
      <div class="brand"><span class="mk"><i></i></span>Ledger</div>
      <div class="dots" role="tablist">
        <button class="on" data-page="0" aria-label="Banking"></button>
        <button data-page="1" aria-label="Net worth"></button>
      </div>
      <button class="btn-sm" id="topConnect">Connect a bank</button>
      <button class="round" id="refreshBtn" aria-label="Refresh">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9M4 5v4h4M4 13a8 8 0 0 0 14.3 4.9M20 19v-4h-4"/></svg>
      </button>
    </div>

    <div class="pager" id="pager">
      <!-- Page 1: Banking -->
      <section class="page" id="pBanking">
        <div class="hero bank-hero">
          <div class="eyebrow">Banking</div>
          <div class="amount" id="cashTotal">—</div>
          <div class="subline" id="cashSub"></div>
        </div>

        <div class="section-head"><h2>Accounts</h2>
          <button class="link" id="addBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add</button>
        </div>
        <div id="cashAccounts"></div>

        <div id="creditWrap" class="hidden">
          <div class="section-head"><h2>Credit</h2></div>
          <div id="creditAccounts"></div>
        </div>

        <div id="otherWrap" class="hidden">
          <div class="section-head"><h2>Investments &amp; loans</h2></div>
          <div id="otherAccounts"></div>
        </div>

        <div class="section-head"><h2>Activity</h2></div>
        <input id="search" class="search" type="search" placeholder="Search transactions">
        <div id="txns" class="list"></div>
        <button id="moreBtn" class="more hidden">Load more</button>
      </section>

      <!-- Page 2: Net worth -->
      <section class="page away" id="pNet">
        <div class="nw-card">
        <div class="hero">
          <div class="eyebrow" id="nwLabel">Net Worth</div>
          <div class="amount" id="nwTotal">—</div>
          <div class="subline" id="nwChange"></div>
        </div>
        <div class="chart" id="chart"></div>
        <div class="ranges" id="ranges">
          <button data-r="7" class="on">1W</button><button data-r="30">1M</button><button data-r="90">3M</button>
          <button data-r="ytd">YTD</button><button data-r="365">1Y</button><button data-r="all">All</button>
        </div>
        <div class="note hidden" id="nwNote"></div>
        </div>

        <div class="nw-foot">

        <div class="panel">
          <div class="split">
            <div><div class="k">Assets</div><div class="v" id="assets">—</div></div>
            <div><div class="k">Liabilities</div><div class="v" id="liabs">—</div></div>
          </div>
          <div class="ratio"><span class="a" id="ratioA" style="flex-grow:1"></span><span class="l" id="ratioL" style="flex-grow:0"></span></div>
        </div>
        <button class="action" id="addBtn2">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Connect an account
          <svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        </div>

        <div class="duo"><div>
        <div class="section-head"><h2>Cash flow</h2></div>
        <div id="cashflow" class="list"></div>
        </div><div>
        <div class="section-head"><h2>Recurring</h2><span id="recurTotal" style="color:var(--gold);font-size:14px"></span></div>
        <div id="recurring" class="list"></div>
        </div></div>
      </section>
    </div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet">
      <div class="grabber"></div>
      <button class="btn" id="sheetLink">Connect a bank</button>
      <h3>Connected</h3>
      <div class="list" id="bankList"></div>
      <button class="btn ghost" id="logoutBtn">Sign out</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const usd = (n) => fmt.format(n ?? 0);
const usd0 = (n) => (n ?? 0).toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const day = (s) => new Date(s + "T12:00:00");
const short = (s) => day(s).toLocaleDateString("en-US", { month: "short", day: "numeric" });
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

let token = null;
try { token = localStorage.getItem("ledger_token"); } catch {}
const state = { banks: [], series: [], range: "7", txCursor: null };

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3500);
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && token) { signOut(); throw new Error("Session expired"); }
  if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
  return data;
}

// ---------- Auth ----------
function showApp(on) {
  $("login").classList.toggle("hidden", on);
  $("app").classList.toggle("hidden", !on);
  if (on) loadAll(); else setTimeout(() => $("pw").focus(), 50);
}
function signOut() {
  token = null; try { localStorage.removeItem("ledger_token"); } catch {}
  closeSheet(); showApp(false);
}
$("login").addEventListener("submit", async (e) => {
  e.preventDefault(); $("loginErr").textContent = "";
  const b = e.submitter; if (b) b.disabled = true;
  try {
    const { token: t } = await api("POST", "/api/auth/password", { password: $("pw").value });
    token = t; try { localStorage.setItem("ledger_token", t); } catch {}
    $("pw").value = ""; showApp(true);
  } catch (err) { $("loginErr").textContent = err.message; }
  finally { if (b) b.disabled = false; }
});
$("logoutBtn").onclick = signOut;

// ---------- Pager ----------
const pager = $("pager"), pages = [$("pBanking"), $("pNet")], dots = [...document.querySelectorAll(".dots button")];
function setPage(i) { pager.scrollTo({ left: i * pager.clientWidth, behavior: "smooth" }); }
dots.forEach((d) => (d.onclick = () => setPage(+d.dataset.page)));
pager.addEventListener("scroll", () => {
  const i = Math.round(pager.scrollLeft / pager.clientWidth);
  dots.forEach((d, j) => d.classList.toggle("on", i === j));
  pages.forEach((p, j) => p.classList.toggle("away", i !== j));
}, { passive: true });
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") setPage(1);
  if (e.key === "ArrowLeft") setPage(0);
});

// ---------- Sheet ----------
function openSheet() { $("shell").classList.add("open"); }
function closeSheet() { $("shell").classList.remove("open"); }
$("menuBtn").onclick = openSheet;
$("scrim").onclick = closeSheet;

// ---------- Data ----------
async function loadAll() {
  const results = await Promise.allSettled([loadAccounts(), loadNetWorth(), loadTxns(true), loadCashflow(), loadRecurring()]);
  const failed = results.find((r) => r.status === "rejected");
  if (failed) toast(failed.reason.message);
}

const isLiab = (a) => a.type === "credit" || a.type === "loan";

function thumbFor(a) {
  const t = el("div", "thumb");
  if (a.type === "credit") { t.classList.add("card", "gold"); t.append(el("div", "emblem")); }
  else if (a.subtype === "savings" || a.subtype === "money market" || a.subtype === "cd") {
    const c = el("div", "coins"); c.append(el("i"), el("i"), el("b")); t.append(c);
  } else if (a.type === "investment" || a.type === "loan") { t.classList.add("bars"); }
  else { t.classList.add("card"); t.append(el("div", "emblem")); }
  return t;
}

function accountCard(a, bank) {
  const card = el("div", "acct fade-in");
  card.append(thumbFor(a));
  const info = el("div", "info");
  info.append(
    el("div", "label", a.name),
    el("div", "bal", usd(a.currentBalance ?? 0)),
    el("div", "meta", [bank.institutionName, a.mask && "••" + a.mask].filter(Boolean).join(" · ")),
  );
  card.append(info);
  if (a.type === "credit" && a.creditLimit) {
    card.append(el("div", "badge", Math.round(((a.currentBalance ?? 0) / a.creditLimit) * 100) + "% used"));
  }
  return card;
}

async function loadAccounts() {
  const { items } = await api("GET", "/api/accounts");
  state.banks = items;
  const cash = $("cashAccounts"), credit = $("creditAccounts"), other = $("otherAccounts");
  cash.replaceChildren(); credit.replaceChildren(); other.replaceChildren();

  let cashTotal = 0, assets = 0, liabs = 0, n = 0;
  for (const bank of items) {
    if (bank.status === "login_required") {
      const w = el("div", "acct warn");
      const info = el("div", "info"); info.style.paddingLeft = "20px";
      info.append(el("div", "label", bank.institutionName || "Bank"), el("div", "meta", "Login expired. Open the menu to reconnect."));
      w.append(info); cash.append(w);
    }
    for (const a of bank.accounts) {
      n++;
      const bal = a.currentBalance ?? 0;
      if (isLiab(a)) liabs += bal; else assets += bal;
      if (a.type === "depository") { cashTotal += bal; cash.append(accountCard(a, bank)); }
      else if (a.type === "credit") credit.append(accountCard(a, bank));
      else other.append(accountCard(a, bank));
    }
  }
  $("creditWrap").classList.toggle("hidden", !credit.children.length);
  $("otherWrap").classList.toggle("hidden", !other.children.length);
  if (!n) cash.append(el("div", "empty", "No accounts yet. Tap Add to connect a bank."));

  $("cashTotal").textContent = usd(cashTotal);
  const synced = items.map((b) => b.lastSyncedAt).filter(Boolean).sort().pop();
  $("cashSub").textContent = n
    ? `${n} account${n === 1 ? "" : "s"}${synced ? " · Updated " + timeAgo(synced) : ""}`
    : "Connect a bank to get started";

  $("assets").textContent = usd(assets);
  $("liabs").textContent = usd(liabs);
  $("ratioA").style.flexGrow = assets || 1;
  $("ratioL").style.flexGrow = liabs;
  state.nwNow = assets - liabs;
  renderBankList();
  renderNetWorth();
}

function timeAgo(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  if (m < 1440) return Math.round(m / 60) + "h ago";
  return Math.round(m / 1440) + "d ago";
}

function renderBankList() {
  const list = $("bankList"); list.replaceChildren();
  for (const b of state.banks) {
    const r = el("div", "row"); const l = el("div", "l");
    l.append(el("div", "t", b.institutionName || "Bank"),
             el("div", "s", b.status === "login_required" ? "Needs reconnect" : b.accounts.length + " accounts"));
    r.append(l);
    if (b.status === "login_required") {
      const fix = el("button", "", "Reconnect"); fix.onclick = () => { closeSheet(); openLink(b.id); }; r.append(fix);
    }
    const rm = el("button", "danger", "Remove");
    rm.onclick = async () => {
      if (!confirm("Disconnect " + (b.institutionName || "this bank") + " and delete its data?")) return;
      try { await api("DELETE", "/api/items/" + encodeURIComponent(b.id)); closeSheet(); await loadAll(); toast("Removed"); }
      catch (e) { toast(e.message); }
    };
    r.append(rm); list.append(r);
  }
  if (!state.banks.length) list.append(el("div", "empty", "Nothing connected yet"));
}

// ---------- Net worth ----------
async function loadNetWorth() {
  const { series } = await api("GET", "/api/insights/networth?days=3650");
  state.series = series;
  renderNetWorth();
}

function rangeSeries() {
  const s = state.series; if (!s.length) return s;
  const r = state.range;
  let from;
  if (r === "all") return s;
  if (r === "ytd") from = new Date(new Date().getFullYear(), 0, 1);
  else { from = new Date(); from.setDate(from.getDate() - Number(r)); }
  const out = s.filter((p) => day(p.date) >= from);
  // keep the point just before the window so the line starts at the window edge
  const before = s.filter((p) => day(p.date) < from).pop();
  return before ? [before, ...out] : out;
}

const RANGE_LABEL = { "7": "past week", "30": "past month", "90": "past 3 months", ytd: "this year", "365": "past year", all: "all time" };

function setHeader(value, change, label) {
  $("nwTotal").textContent = usd(value);
  const sub = $("nwChange"); sub.replaceChildren();
  if (change == null) { sub.textContent = label || ""; return; }
  const tri = el("span", "tri " + (change.abs >= 0 ? "up" : "down"));
  const pct = change.base ? " (" + Math.abs((change.abs / Math.abs(change.base)) * 100).toFixed(1) + "%)" : "";
  sub.append(tri, el("span", "", usd(Math.abs(change.abs)) + pct + " " + label));
}

function renderNetWorth() {
  const pts = rangeSeries();
  const now = state.nwNow ?? (pts.length ? pts[pts.length - 1].netWorth : 0);
  if (pts.length >= 2) {
    const first = pts[0].netWorth;
    setHeader(now, { abs: now - first, base: first }, RANGE_LABEL[state.range]);
  } else {
    setHeader(now, null, state.series.length ? "History builds day by day" : "");
  }
  drawChart(pts);
  const est = pts.filter((p) => p.estimated);
  const note = $("nwNote");
  note.classList.toggle("hidden", !est.length || pts.length < 2);
  if (est.length) note.textContent = "Balances before " + short(addDays(est[est.length - 1].date, 1)) + " are estimated from your transaction history";
}
function addDays(s, n) { const d = day(s); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

document.querySelectorAll("#ranges button").forEach((b) => (b.onclick = () => {
  document.querySelectorAll("#ranges button").forEach((x) => x.classList.toggle("on", x === b));
  state.range = b.dataset.r; renderNetWorth();
}));

function drawChart(pts, animate = true) {
  const box = $("chart"); box.replaceChildren();
  if (pts.length < 2) {
    box.append(el("div", "empty-chart", state.series.length
      ? "Your net worth chart fills in automatically, one point per day"
      : "Connect an account to start tracking net worth"));
    return;
  }
  const wide = matchMedia("(min-width: 960px)").matches;
  const W = box.clientWidth || 400, H = box.clientHeight || 210, padX = wide ? 32 : 0, padY = 26, endX = W * (wide ? 0.93 : 0.62);
  const vals = pts.map((p) => p.netWorth), lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const t0 = day(pts[0].date).getTime(), t1 = day(pts[pts.length - 1].date).getTime(), tspan = t1 - t0 || 1;
  // Like the reference: the line ends ~60% across with a glowing tip, leaving room on the right.
  const X = (p) => padX + ((day(p.date).getTime() - t0) / tspan) * (endX - padX);
  const Y = (v) => padY + (1 - (v - lo) / span) * (H - padY * 2);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p).toFixed(1) + " " + Y(p.netWorth).toFixed(1)).join(" ");
  const lx = X(pts[pts.length - 1]), ly = Y(pts[pts.length - 1].netWorth);

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = `
    <defs>
      <linearGradient id="stroke" x1="0" x2="${endX}" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#c9aa6c" stop-opacity=".25"/>
        <stop offset=".55" stop-color="#c9aa6c" stop-opacity=".85"/>
        <stop offset="1" stop-color="#fbf0d4"/>
      </linearGradient>
      <linearGradient id="flare" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f1dfb3" stop-opacity="0"/>
        <stop offset=".5" stop-color="#f1dfb3" stop-opacity=".9"/>
        <stop offset="1" stop-color="#f1dfb3" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="halo"><stop offset="0" stop-color="#f1dfb3" stop-opacity=".55"/><stop offset="1" stop-color="#c9aa6c" stop-opacity="0"/></radialGradient>
      <radialGradient id="floor"><stop offset="0" stop-color="#9a7535" stop-opacity=".2"/><stop offset="1" stop-color="#9a7535" stop-opacity="0"/></radialGradient>
      <filter id="glow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3.5"/></filter>
    </defs>
    <path id="line" d="${d}" fill="none" stroke="url(#stroke)" stroke-width="${wide ? 2 : 1.6}" stroke-linejoin="round" stroke-linecap="round"/>
    <g id="tip" transform="translate(${lx} ${ly})">
      <rect x="-.75" y="-36" width="1.5" height="72" fill="url(#flare)"/>
      <circle r="14" fill="url(#halo)"/>
      <circle r="3.4" fill="#fff8e6"/>
    </g>
    <g id="cursor" opacity="0">
      <line id="cl" y1="0" y2="${H}" stroke="#f1dfb3" stroke-opacity=".25" stroke-dasharray="2 4"/>
      <circle id="cd" r="4" fill="#fff8e6" stroke="#0b0a09" stroke-width="2"/>
    </g>`;
  box.append(svg);

  // Draw-on animation
  const line = svg.querySelector("#line"), len = line.getTotalLength?.() || 0;
  if (animate && len && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    line.style.strokeDasharray = len; line.style.strokeDashoffset = len;
    line.getBoundingClientRect();
    line.style.transition = "stroke-dashoffset 900ms cubic-bezier(.22,1,.36,1)";
    line.style.strokeDashoffset = 0;
  }

  // Scrub: hover/drag to see the value on a given day
  const cursor = svg.querySelector("#cursor"), cl = svg.querySelector("#cl"), cd = svg.querySelector("#cd");
  const move = (ev) => {
    const rect = box.getBoundingClientRect();
    const x = Math.min(Math.max(((ev.clientX - rect.left) / rect.width) * W, 0), endX);
    let best = pts[0];
    for (const p of pts) if (Math.abs(X(p) - x) < Math.abs(X(best) - x)) best = p;
    cl.setAttribute("x1", X(best)); cl.setAttribute("x2", X(best));
    cd.setAttribute("cx", X(best)); cd.setAttribute("cy", Y(best.netWorth));
    cursor.setAttribute("opacity", 1);
    $("nwLabel").textContent = day(best.date).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) + (best.estimated ? " · estimated" : "");
    setHeader(best.netWorth, { abs: best.netWorth - pts[0].netWorth, base: pts[0].netWorth }, "since " + short(pts[0].date));
  };
  const leave = () => { cursor.setAttribute("opacity", 0); $("nwLabel").textContent = "Net Worth"; renderNetWorthHeaderOnly(); };
  box.onpointermove = move; box.onpointerdown = move; box.onpointerleave = leave; box.onpointerup = (e) => { if (e.pointerType !== "mouse") leave(); };
}

function renderNetWorthHeaderOnly() {
  const pts = rangeSeries(), now = state.nwNow ?? 0;
  if (pts.length >= 2) setHeader(now, { abs: now - pts[0].netWorth, base: pts[0].netWorth }, RANGE_LABEL[state.range]);
  else setHeader(now, null, state.series.length ? "History builds day by day" : "");
}

let resizeT;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => drawChart(rangeSeries(), false), 150); });

// ---------- Transactions ----------
function logoFor(t) {
  const box = el("div", "logo");
  if (t.logoUrl) {
    const img = new Image(); img.alt = ""; img.src = t.logoUrl;
    img.onerror = () => { box.replaceChildren(); box.textContent = (t.merchantName || t.name || "?").trim()[0].toUpperCase(); };
    box.append(img);
  } else box.textContent = (t.merchantName || t.name || "?").trim()[0].toUpperCase();
  return box;
}

async function loadTxns(reset) {
  if (reset) { state.txCursor = null; $("txns").replaceChildren(); }
  const p = new URLSearchParams({ limit: "40" });
  if (state.txCursor) p.set("cursor", state.txCursor);
  const q = $("search").value.trim(); if (q) p.set("q", q);
  const { transactions, nextCursor } = await api("GET", "/api/transactions?" + p);
  for (const t of transactions) {
    const amt = -t.amount;
    const r = el("div", "row"); const l = el("div", "l");
    l.append(el("div", "t", t.merchantName || t.name),
             el("div", "s", [short(t.date), t.accountName, t.pending && "Pending"].filter(Boolean).join(" · ")));
    r.append(logoFor(t), l, el("div", "r" + (amt > 0 ? " in" : ""), (amt > 0 ? "+" : "") + usd(amt)));
    $("txns").append(r);
  }
  if (reset && !transactions.length) $("txns").append(el("div", "empty", q ? "No matches" : "No transactions yet"));
  state.txCursor = nextCursor;
  $("moreBtn").classList.toggle("hidden", !nextCursor);
}
$("moreBtn").onclick = () => loadTxns(false).catch((e) => toast(e.message));
let searchT;
$("search").addEventListener("input", () => { clearTimeout(searchT); searchT = setTimeout(() => loadTxns(true).catch((e) => toast(e.message)), 300); });

// ---------- Cash flow & recurring ----------
function monthLabel(ym) {
  const d = day(ym + "-01"), m = d.toLocaleDateString("en-US", { month: "short" });
  return d.getFullYear() === new Date().getFullYear() ? m : m + " \u2019" + String(d.getFullYear()).slice(2);
}
async function loadCashflow() {
  const { monthly } = await api("GET", "/api/insights/cashflow?months=6");
  const box = $("cashflow"); box.replaceChildren();
  if (!monthly.length) { box.append(el("div", "empty", "No data yet")); return; }
  const max = Math.max(...monthly.flatMap((m) => [m.income, m.spending]), 1);
  const wrap = el("div", "bars-chart");
  for (const m of [...monthly].reverse()) {
    const net = m.income - m.spending;
    const row = el("div", "bm");
    const track = el("div", "track");
    const inc = el("i", "inc"); inc.style.width = (m.income / max) * 100 + "%";
    const out = el("i", "out"); out.style.width = (m.spending / max) * 100 + "%";
    inc.title = "In " + usd(m.income); out.title = "Out " + usd(m.spending);
    track.append(inc, out);
    row.append(el("span", "m", monthLabel(m.month)),
               track, el("span", "n" + (net < 0 ? " neg" : ""), (net >= 0 ? "+" : "−") + usd(Math.abs(net))));
    wrap.append(row);
  }
  box.append(wrap);
}

async function loadRecurring() {
  const { recurring, monthlyTotal } = await api("GET", "/api/insights/recurring");
  const box = $("recurring"); box.replaceChildren();
  $("recurTotal").textContent = recurring.length ? usd(monthlyTotal) + "/mo" : "";
  for (const r of recurring) {
    const row = el("div", "row" + (r.active ? "" : " faded")); const l = el("div", "l");
    l.append(el("div", "t", r.name),
             el("div", "s", r.frequency[0].toUpperCase() + r.frequency.slice(1) + " · " + (r.active ? "next ~" + short(r.nextExpectedDate) : "stopped " + short(r.lastDate))));
    row.append(logoFor({ name: r.name }), l, el("div", "r", usd(r.lastAmount)));
    box.append(row);
  }
  if (!recurring.length) box.append(el("div", "empty", "Nothing recurring detected yet"));
}

// ---------- Actions ----------
$("refreshBtn").onclick = async () => {
  const b = $("refreshBtn"); if (b.classList.contains("spinning")) return;
  b.classList.add("spinning");
  try { await api("POST", "/api/sync"); await loadAll(); toast("Up to date"); }
  catch (e) { toast(e.message); }
  finally { b.classList.remove("spinning"); }
};

async function openLink(itemId) {
  try {
    const { linkToken } = await api("POST", "/api/link/token", itemId ? { itemId } : {});
    Plaid.create({
      token: linkToken,
      onSuccess: async (publicToken) => {
        toast("Connecting… pulling your transactions");
        try {
          if (itemId) await api("POST", "/api/sync");              // update mode: no exchange
          else await api("POST", "/api/link/exchange", { publicToken });
          await loadAll(); toast("Bank connected");
        } catch (e) { toast(e.message); }
      },
      onExit: (err) => { if (err) toast(err.display_message || err.error_message || "Link closed"); },
    }).open();
  } catch (e) { toast(e.message); }
}
$("addBtn").onclick = () => openLink();
$("addBtn2").onclick = () => openLink();
$("topConnect").onclick = () => openLink();
$("sheetLink").onclick = () => { closeSheet(); openLink(); };

showApp(!!token);
</script>
</body>
