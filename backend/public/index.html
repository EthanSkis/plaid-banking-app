<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger</title>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #14171c; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --good: #15803d; --bad: #b91c1c; --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1014; --card: #161a20; --text: #e8eaed; --muted: #9aa1ab; --line: #262b33;
            --accent: #60a5fa; --good: #4ade80; --bad: #f87171; --warn: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .sub { font-size: 12px; color: var(--muted); }
  .row .l { min-width: 0; } .row .l > div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amt { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .pos { color: var(--good); } .neg { color: var(--bad); } .warn { color: var(--warn); }
  .big { font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hero { padding: 20px 16px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer;
           background: var(--accent); color: #fff; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  input { font: inherit; width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--card); color: var(--text); }
  .empty { padding: 20px 16px; color: var(--muted); }
  .login { max-width: 340px; margin: 18vh auto 0; display: grid; gap: 12px; }
  .err { color: var(--bad); font-size: 14px; min-height: 1.2em; }
  .hidden { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<main>
  <!-- Login -->
  <form id="login" class="login hidden">
    <h1>Ledger</h1>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div id="loginErr" class="err"></div>
  </form>

  <!-- App -->
  <div id="app" class="hidden">
    <header>
      <h1>Ledger</h1>
      <div class="actions">
        <button id="refreshBtn" class="ghost">Refresh</button>
        <button id="linkBtn">Connect bank</button>
        <button id="logoutBtn" class="ghost">Sign out</button>
      </div>
    </header>

    <div class="card hero">
      <div class="sub" style="color:var(--muted)">Net worth</div>
      <div id="netWorth" class="big">–</div>
    </div>

    <h2>Accounts</h2>
    <div id="accounts" class="card"></div>

    <h2>Recent transactions</h2>
    <input id="search" type="search" placeholder="Search merchant or description" style="margin-bottom:8px">
    <div id="txns" class="card"></div>
    <div style="margin-top:8px"><button id="moreBtn" class="ghost hidden">Load more</button></div>

    <h2>Cash flow by month</h2>
    <div id="cashflow" class="card"></div>

    <h2>Recurring charges <span id="recurTotal" style="text-transform:none;letter-spacing:0"></span></h2>
    <div id="recurring" class="card"></div>
  </div>
</main>
<div id="toast" class="toast hidden"></div>

<script>
const $ = (id) => document.getElementById(id);
const usd = (n) => (n ?? 0).toLocaleString("en-US", { style: "currency", currency: "USD" });
const prettyDate = (s) => new Date(s + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
let token = localStorage.getItem("ledger_token");
let txCursor = null;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hidden"), 4000);
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && token) { signOut(); throw new Error("Session expired"); }
  if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
  return data;
}

// Build DOM rows with textContent only (bank data is untrusted, never use innerHTML with it)
function row(left, sub, right, rightClass = "") {
  const r = document.createElement("div"); r.className = "row";
  const l = document.createElement("div"); l.className = "l";
  const a = document.createElement("div"); a.textContent = left; l.append(a);
  if (sub) { const s = document.createElement("div"); s.className = "sub"; s.textContent = sub; l.append(s); }
  const rr = document.createElement("div"); rr.className = "amt " + rightClass;
  if (right instanceof Node) rr.append(right); else rr.textContent = right;
  r.append(l, rr); return r;
}
function empty(el, msg) { el.replaceChildren(Object.assign(document.createElement("div"), { className: "empty", textContent: msg })); }

// ---------- Auth ----------
function showApp(signedIn) {
  $("login").classList.toggle("hidden", signedIn);
  $("app").classList.toggle("hidden", !signedIn);
  if (signedIn) loadAll(); else $("pw").focus();
}
function signOut() { token = null; localStorage.removeItem("ledger_token"); showApp(false); }

$("login").addEventListener("submit", async (e) => {
  e.preventDefault(); $("loginErr").textContent = "";
  try {
    const { token: t } = await api("POST", "/api/auth/password", { password: $("pw").value });
    token = t; localStorage.setItem("ledger_token", t); $("pw").value = ""; showApp(true);
  } catch (err) { $("loginErr").textContent = err.message; }
});
$("logoutBtn").onclick = signOut;

// ---------- Data ----------
async function loadAll() {
  await Promise.all([loadAccounts(), loadTxns(true), loadCashflow(), loadRecurring()]).catch((e) => toast(e.message));
}

async function loadAccounts() {
  const { items } = await api("GET", "/api/accounts");
  const el = $("accounts"); el.replaceChildren();
  let net = 0;
  for (const bank of items) {
    if (bank.status === "login_required") {
      const fix = document.createElement("button"); fix.className = "ghost"; fix.textContent = "Reconnect";
      fix.onclick = () => openLink(bank.id);
      el.append(row(bank.institutionName || "Bank", "Login expired", fix, "warn"));
    }
    for (const a of bank.accounts) {
      const liability = a.type === "credit" || a.type === "loan";
      const bal = (a.currentBalance ?? 0) * (liability ? -1 : 1);
      net += bal;
      const sub = [bank.institutionName, a.subtype, a.mask && "••" + a.mask].filter(Boolean).join(" · ");
      el.append(row(a.name, sub, usd(bal), liability ? "neg" : ""));
    }
    const rm = document.createElement("button"); rm.className = "ghost"; rm.textContent = "Remove";
    rm.onclick = async () => {
      if (!confirm("Disconnect " + (bank.institutionName || "this bank") + " and delete its data?")) return;
      await api("DELETE", "/api/items/" + encodeURIComponent(bank.id)).then(loadAll).catch((e) => toast(e.message));
    };
    el.append(row(bank.institutionName || "Bank", "Connected bank", rm));
  }
  if (!items.length) empty(el, "No banks connected yet. Click “Connect bank”.");
  $("netWorth").textContent = usd(net);
}

async function loadTxns(reset) {
  if (reset) { txCursor = null; $("txns").replaceChildren(); }
  const p = new URLSearchParams({ limit: "50" });
  if (txCursor) p.set("cursor", txCursor);
  const q = $("search").value.trim(); if (q) p.set("q", q);
  const { transactions, nextCursor } = await api("GET", "/api/transactions?" + p);
  for (const t of transactions) {
    const amt = -t.amount; // Plaid: positive = money out
    const sub = [prettyDate(t.date), t.accountName, t.pending && "Pending"].filter(Boolean).join(" · ");
    $("txns").append(row(t.merchantName || t.name, sub, usd(amt), amt > 0 ? "pos" : ""));
  }
  if (reset && !transactions.length) empty($("txns"), q ? "No matches." : "No transactions yet.");
  txCursor = nextCursor;
  $("moreBtn").classList.toggle("hidden", !nextCursor);
}
$("moreBtn").onclick = () => loadTxns(false).catch((e) => toast(e.message));
let searchTimer;
$("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadTxns(true).catch((e) => toast(e.message)), 300);
});

async function loadCashflow() {
  const { monthly } = await api("GET", "/api/insights/cashflow");
  const el = $("cashflow"); el.replaceChildren();
  for (const m of [...monthly].reverse()) {
    const net = m.income - m.spending;
    const label = new Date(m.month + "-15").toLocaleDateString("en-US", { month: "long", year: "numeric" });
    el.append(row(label, "In " + usd(m.income) + " · Out " + usd(m.spending), (net >= 0 ? "+" : "") + usd(net), net >= 0 ? "pos" : "neg"));
  }
  if (!monthly.length) empty(el, "No data yet.");
}

async function loadRecurring() {
  const { recurring, monthlyTotal } = await api("GET", "/api/insights/recurring");
  const el = $("recurring"); el.replaceChildren();
  $("recurTotal").textContent = recurring.length ? "· " + usd(monthlyTotal) + "/mo" : "";
  for (const r of recurring) {
    const when = r.active ? "next ~" + prettyDate(r.nextExpectedDate) : "stopped, last " + prettyDate(r.lastDate);
    const item = row(r.name, r.frequency + " · " + when, usd(r.lastAmount));
    if (!r.active) item.style.opacity = .55;
    el.append(item);
  }
  if (!recurring.length) empty(el, "Nothing recurring detected yet. Needs a few months of history.");
}

$("refreshBtn").onclick = async () => {
  $("refreshBtn").disabled = true;
  try { await api("POST", "/api/sync"); await loadAll(); toast("Up to date"); }
  catch (e) { toast(e.message); }
  finally { $("refreshBtn").disabled = false; }
};

// ---------- Plaid Link ----------
async function openLink(itemId) {
  $("linkBtn").disabled = true;
  try {
    const { linkToken } = await api("POST", "/api/link/token", itemId ? { itemId } : {});
    Plaid.create({
      token: linkToken,
      onSuccess: async (publicToken) => {
        toast("Connecting… pulling your transactions");
        try {
          if (itemId) await api("POST", "/api/sync");            // update mode: don't exchange
          else await api("POST", "/api/link/exchange", { publicToken });
          await loadAll();
          toast("Bank connected");
        } catch (e) { toast(e.message); }
      },
      onExit: (err) => { if (err) toast(err.display_message || err.error_message || "Link closed"); },
    }).open();
  } catch (e) { toast(e.message); }
  finally { $("linkBtn").disabled = false; }
}
$("linkBtn").onclick = () => openLink();

showApp(!!token);
</script>
</body>
</html>
